name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dependances
        run: npm install
      - name: Creer le projet Android
        run: npx cap add android
      - name: Ajouter les autorisations
        run: python3 patch_android.py
      - name: Synchroniser le site
        run: npx cap sync android
      - name: Cle de signature fixe
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Compiler
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publier l APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cahier-appel.apk
          gh release create "v${{ github.run_number }}" cahier-appel.apk --title "Version ${{ github.run_number }}" --notes "APK Android"
