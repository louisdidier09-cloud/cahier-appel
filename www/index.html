function shrink(f,max){return new Promise((ok,ko)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(),'image/jpeg',.82)};im.onerror=ko;im.src=u})}
function upCld(file,kind,name){return new Promise(res=>{const m=(S.cfg||{}).medias;if(!m||!m.cloud||!m.preset){alert('Le stockage des photos et vidéos n\'est pas configuré : un responsable doit le faire.');return res(null)}
const X=new(window.CapacitorWebXMLHttpRequest||XMLHttpRequest)(),fd=new FormData();fd.append('file',file,name||file.name||'fichier');fd.append('upload_preset',m.preset);
X.open('POST','https://api.cloudinary.com/v1_1/'+encodeURIComponent(m.cloud)+'/'+kind+'/upload');
X.upload.onprogress=e=>{const el=$('up_'+kind);if(el&&e.lengthComputable)el.style.width=Math.round(e.loaded/e.total*100)+'%'};
X.onload=()=>{try{const r=JSON.parse(X.responseText);if(X.status<300&&r.secure_url)res({u:r.secure_url,pid:r.public_id});else{alert('Envoi refusé : '+((r.error&&r.error.message)||X.status));res(null)}}catch{alert('Réponse inattendue du stockage.');res(null)}};
X.onerror=()=>{alert('Envoi impossible : vérifie ta connexion.');res(null)};X.send(fd)})}
async function xPhoto(f){const e=S.xe;e.pup=1;render();try{const b=await shrink(f,1280),r=await upCld(b,'image','photo.jpg');if(r)e.photo=r.u}catch{alert('Photo illisible.')}e.pup=0;render()}
